[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "customer-churn-prediction"
version = "1.0.0"
description = "Leakage-aware customer churn prediction workflow"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<3", "pandas>=1.5,<4", "scikit-learn>=1.2,<2", "joblib>=1.2,<2"]
[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["F"]
